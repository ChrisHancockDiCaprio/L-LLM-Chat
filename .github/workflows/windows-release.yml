name: Windows portable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) throw new Error('Release tag differs from package version')"
      - run: npm test
      - run: python server/test_bridge.py
      - name: Verify isolated Electron UI with fixture servers
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npm run verify:update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run verify:hancock
      - run: npm run verify:providers
      - run: npm run licenses
      - run: npm run dist
      - run: node scripts/check-package.mjs
      - name: Validate packaged portable app and write release checksum
        run: node scripts/verify-portable.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qwen-chat-windows
          path: |
            dist-release/KAIROS-Portable-*-x64.zip
            dist-release/KAIROS-Portable-*-x64.zip.sha256
            dist-release/validation-*.json
            THIRD_PARTY_NOTICES.md
            PORTABLE.md
            server/qwen_tts_bridge.py
            QWEN-TTS.md
            TTS-STUDIO.md
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish release with tested artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh release view $env:RELEASE_TAG --json isDraft > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "A release already exists for this tag. Its files remain unchanged."
            exit 0
          }
          gh run download $env:RUN_ID --name qwen-chat-windows --dir release-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = @(Get-ChildItem release-assets -Recurse -File | ForEach-Object { $_.FullName })
          gh api "repos/$env:GH_REPO/contents/release/notes.md?ref=$env:RELEASE_TAG" --header "Accept: application/vnd.github.raw+json" > release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseFlags = @()
          if ($env:RELEASE_TAG.Contains('-')) { $releaseFlags += '--prerelease' }
          gh release create $env:RELEASE_TAG @assets @releaseFlags --verify-tag --title "KAIROS $env:RELEASE_TAG" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
