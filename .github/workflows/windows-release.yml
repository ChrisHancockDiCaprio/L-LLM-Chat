name: Windows setup
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run dist
      - run: node scripts/check-package.mjs
      - run: npm run dist:msi -- --prepackaged dist-release/win-unpacked
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qwen-chat-windows
          path: |
            dist-release/*.exe
            dist-release/*.blockmap
            dist-release/latest.yml
            dist-msi-release/*.msi
          if-no-files-found: error
  release-draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Create draft release with tested artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh release view $env:RELEASE_TAG --json isDraft > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "A release already exists for this tag. Its files remain unchanged."
            exit 0
          }
          gh run download $env:RUN_ID --name qwen-chat-windows --dir release-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --draft --verify-tag --title "Qwen Chat $env:RELEASE_TAG" --notes "Windows-Pilotversion. Installation über bestehende Installation erhält den externen verschlüsselten Tresor. Noch nicht mit einem Windows-Herausgeberzertifikat signiert."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
